name: Deploy
on:
  push:
    branches:
      - production
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.SERVER_IP}}
          username: ${{secrets.SERVER_USERNAME}}
          password: ${{secrets.SERVER_PASSWORD}}
          # Change the branch to be the specific environment you want to use
          script: |
            cd ${{secrets.PROJECT_PATH}}
            source ../../nvm.sh
            nvm use 25
            php artisan down
            git switch production
            git pull
            composer run prod:setup
            composer run prod-setup:post
            npm run prod:setup
            php artisan up
